name: Deploy to WSL
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
     - name: Checkout code
      uses: actions/checkout@v4
     - name: Deploy via SSH

      uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rltgoDzvO --delete"
          SOURCE: "HTML/"
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: user

          TARGET: "/var/www/myweb/HTML"
